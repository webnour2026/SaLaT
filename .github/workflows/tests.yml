name: Tests

# À chaque envoi de code et à chaque demande de fusion : contrôle de syntaxe de tous les fichiers JavaScript
# et tous les jeux de tests (scripts/test-*.mjs). Aucune dépendance à installer : Node seul (+ Java pour les tests du module Android).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4        # test-java-clock.mjs et test-java-calc.mjs compilent le Java du module Android
        with:
          distribution: temurin
          java-version: 17
      - run: npm test
