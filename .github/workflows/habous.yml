# Calendrier hégirien du Maroc : met à jour data/habous.json dès que le Ministère des Habous annonce
# le début d'un mois (communiqué du soir du 29). L'appli lit ce fichier à chaque ouverture.
# Rien à configurer. Si l'annonce n'est pas trouvée automatiquement :
#   onglet Actions → « Habous » → Run workflow → saisir le 1er jour du mois (AAAA-MM-JJ).
name: Habous
on:
  schedule:
    # GitHub décale souvent ces horaires de plusieurs heures : chaque exécution du soir d'annonce surveille elle-même
    # (toutes les 5 min, jusqu'à 4 h 30) ; plusieurs départs pour qu'au moins un tombe à temps, les suivants attendent leur tour.
    - cron: '50 16 * * *'
    - cron: '35 18 * * *'
    - cron: '20 20 * * *'
    - cron: '40 6 * * *'       # rattrapage le lendemain matin
  workflow_dispatch:
    inputs:
      start:
        description: "Saisie manuelle : 1er jour du mois suivant (AAAA-MM-JJ)"
        required: false
permissions:
  contents: write
concurrency:
  group: habous
  cancel-in-progress: false
jobs:
  habous:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests de l'analyse des communiqués
        run: node scripts/test-habous.mjs
      - name: Chercher l'annonce du ministère
        run: node scripts/update-habous.mjs
        env:
          MANUAL_START: ${{ github.event.inputs.start }}
          WATCH_MIN: ${{ github.event_name == 'schedule' && '270' || (github.event.inputs.start == '' && '180' || '0') }}
      - name: Publier si le calendrier a changé
        run: |
          if [ -n "$(git status --porcelain data/habous.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/habous.json
            git commit -m "Habous : nouveau début de mois annoncé"
            git push
          else
            echo "Rien de nouveau"
          fi
