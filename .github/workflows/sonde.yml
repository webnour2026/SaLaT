name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='Mozilla/5.0 SaLaTi-verification/1.0'
          n=0
          for base in "http://www.habous.gov.ma" "https://www.habous.gov.ma" "http://habous.gov.ma" "https://habous.gov.ma"; do
            n=$((n+1)); rm -f p.html
            r=$(curl -skL --max-time 25 --connect-timeout 15 -A "$UA" "$base/horaire%20de%20priere%20fr/fr/horaire-1.php?ville=69" -o p.html -w "%{http_code}|%{size_download}|%{num_redirects}" 2>&1)
            txt=$(sed 's/<[^>]*>/ /g' p.html 2>/dev/null | tr -s ' \n\r\t' ' ' | tr -d ':,' | head -c 800)
            echo "::notice title=R$n::$base $r // $txt"
          done
          rm -f p.html; curl -skL --max-time 25 -A "$UA" "https://www.habous.gov.ma/horaire%20de%20priere%20fr/fr/horaire-2.php?ville=1" -o p.html
          echo "::notice title=H2::$(sed 's/<[^>]*>/ /g' p.html | tr -s ' \n\r\t' ' ' | tr -d ':,' | head -c 900)"
          echo "::notice title=H2src::$(head -c 1500 p.html | tr '\n\r' '  ' | tr -d ':,')"
