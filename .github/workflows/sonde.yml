name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -sL -A 'SaLaTi-verification/1.0' "https://fm6oa.org/prieres/" | tr '\n' ' ' | grep -oE 'href="[^"]+"</a>[^<]*</td><td align="right">[^<]*' | sed 's/<[^>]*>/ /g' | while IFS= read -r l; do echo "::notice title=ls::$l"; done
          curl -sL -A 'SaLaTi-verification/1.0' "https://fm6oa.org/prieres/code/" | tr '\n' ' ' | grep -oE 'href="[^"]+"</a>[^<]*</td><td align="right">[^<]*' | sed 's/<[^>]*>/ /g' | head -9 | while IFS= read -r l; do echo "::notice title=code::$l"; done
