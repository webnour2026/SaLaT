name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          cat > t.mjs <<'JS'
          const enc = encodeURIComponent;
          for (const site of ['mapnews.ma', '2m.ma']) {
            const u = `https://news.google.com/rss/search?q=${enc(`site:${site} (هلال OR croissant OR Habous OR الأوقاف) when:3d`)}&hl=fr&gl=MA&ceid=MA:fr`;
            const s = await (await fetch(u)).text();
            const it = [...s.matchAll(/<item>([\s\S]*?)<\/item>/g)].map(m => m[1]);
            console.log(`::notice::${site} items=${it.length} :: ` + it.slice(0, 4).map(e => (e.match(/<pubDate>(.*?)</) || [])[1]?.slice(5, 22) + ' ' + (e.match(/<title>(.*?)<\/title>/) || [])[1]?.slice(0, 70)).join(' | '));
          }
          JS
          node t.mjs
