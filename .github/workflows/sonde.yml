name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='SaLaTi-verification/1.0 (appli de prière ; github.com/webnour2026/SaLaT)'
          curl -sL -A "$UA" https://priere.ma/robots.txt -o r.txt -w "%{http_code}\n" > c.txt; echo "::notice title=robots $(cat c.txt)::$(head -c 900 r.txt | tr '\n' '|')"
          for v in marrakech rabat casablanca; do
            curl -sL -A "$UA" "https://priere.ma/horaire-priere-$v" -o p.html -w "%{http_code}" > c.txt
            rows=$(tr '\n' ' ' < p.html | sed 's/<tr/\n<tr/g' | grep -E '([0-9]{2}:[0-9]{2}.*){6}' | sed 's/<[^>]*>/ /g; s/&nbsp;/ /g' | tr -s ' ' | head -31 | tr '\n' '|')
            echo "::notice title=$v $(cat c.txt)::${rows:0:3500}"
          done
