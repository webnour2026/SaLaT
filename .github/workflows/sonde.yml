name: Sonde (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -m 30 https://habous.synerticlab.com/habous-api/villes -o scripts/data/habous-api-villes.json
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/habous-api-villes.json && git commit -m "Sonde : liste des villes de l'API des Habous" && git push
