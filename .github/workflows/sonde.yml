name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (compatible; SaLaT-habous/1.1)"
          echo "::notice::ROBOTS $(curl -sSL -m 15 -A "$UA" https://alyaoum24.com/robots.txt | grep -iv '^#' | grep -i -A4 'user-agent: \*' | tr '\n' ' ' | cut -c1-250)"
          for u in https://alyaoum24.com/feed https://www.alyaoum24.com/feed https://alyaoum24.com/feed/; do
            r=$(curl -sSL -m 20 -A "$UA" -o p -w "%{http_code} %{size_download}" "$u" 2>&1 | cut -c1-80)
            echo "::notice::$u => $r items=$(grep -c '<item' p) last=$(grep -o '<pubDate>[^<]*' p | head -1) hit=$(grep -o '<title>[^<]*\(جمادى\|هلال\)[^<]*' p | head -1 | cut -c1-90)"
          done
          curl -sS -m 20 "https://news.google.com/rss/search?q=site:alyaoum24.com+when:3d&hl=fr&gl=MA&ceid=MA:fr" -o g; echo "::notice::GN alyaoum24 items=$(grep -c '<item' g) $(grep -o '<title>[^<]*جمادى[^<]*' g | head -1 | cut -c1-90)"
          curl -sS -m 20 "https://news.google.com/rss/search?q=site:habous.gov.ma&hl=fr&gl=MA&ceid=MA:fr" -o h; echo "::notice::GN habous items=$(grep -c '<item' h)"
