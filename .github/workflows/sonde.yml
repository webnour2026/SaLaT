name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://habous.synerticlab.com/habous-api/prayer-times
          for q in "ville=1&date=2026-10-20" "ville=1&date=20/10/2026" "ville=1&jour=20&mois=10&annee=2026" "ville=1&month=10&year=2026" "ville=1&mois=5&annee=1448"; do echo "::notice::Q $q => $(curl -sS -m 20 "$B?$q" | cut -c1-260)"; done
          for p in /habous-api /habous-api/monthly?ville=1 /habous-api/prayer-times-month?ville=1 /habous-api/mawaqit?ville=1; do echo "::notice::P $p => $(curl -sS -m 20 -o /tmp/x -w '%{http_code}' "https://habous.synerticlab.com$p") $(head -c 200 /tmp/x | tr -d '\n')"; done
          curl -sS -m 25 "https://habous.synerticlab.com/mawaqit-shahria" -o m.html
          sed 's/<[^>]*>/ /g' m.html | tr -s ' \n' ' ' | grep -o '.\{0,200\}05:43.\{0,40\}' | head -1 | sed 's/^/::notice::CTX /'
          grep -o '<form[^>]*>\|<input[^>]*name="[^"]*"[^>]*>\|<select[^>]*name="[^"]*"' m.html | head -8 | tr '\n' ' ' | sed 's/^/::notice::FORM /'
