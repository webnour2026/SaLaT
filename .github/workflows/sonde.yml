name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://habous.synerticlab.com
          echo "::notice::ROBOTS-API $(curl -sS $B/robots.txt | grep -i 'habous-api\|Disallow: /$' | tr '\n' ' ')"
          echo "::notice::HIJRI $(curl -sS -m 20 $B/habous-api/hijri-date | cut -c1-300)"
          curl -sS -m 20 $B/habous-api/villes -o v.json; echo "::notice::VILLES $(head -c 400 v.json) ... n=$(grep -o '"id"' v.json | wc -l) bytes=$(wc -c < v.json)"
          for v in 1 58 104 100 165; do echo "::notice::PT$v $(curl -sS -m 20 "$B/habous-api/prayer-times?ville=$v" | cut -c1-400)"; done
          curl -sSI -m 20 "$B/habous-api/prayer-times?ville=1" | grep -i 'cache\|date\|access-control' | tr '\n' ' ' | sed 's/^/::notice::HDR /'
          curl -sS -m 25 "$B/mawaqit-shahria?ville=58" -o m.html; sed 's/<[^>]*>/ /g' m.html | tr -s ' \n' ' ' | grep -oE '([0-9]{2}:[0-9]{2} ?){6}' | head -3 | tr '\n' '|' | sed 's/^/::notice::MONTH /'
          grep -o 'habous-monthly[^"]*' m.html | sort -u | head | tr '\n' ' ' | sed 's/^/::notice::CLS /'
