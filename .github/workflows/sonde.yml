name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://habous.synerticlab.com
          echo "::notice::ROBOTS $(curl -sS -m 20 $B/robots.txt | grep -iv '^#' | grep -i -A2 'user-agent: \*' | tr '\n' ' ' | cut -c1-300)"
          for p in /taxonomy/term/1572 /taxonomy/term/1572/feed /rss.xml /mawaqit-shahria; do
            r=$(curl -sS -m 25 -o /tmp/p -w "%{http_code} %{size_download}" "$B$p" 2>&1 | cut -c1-120)
            n=$(grep -o 'هلال' /tmp/p | wc -l); x=$(grep -oi 'x-robots-tag\|noindex' /tmp/p | head -1)
            t=$(sed 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n' ' ' | grep -o '.\{0,60\}هلال شهر.\{0,80\}' | head -3 | tr '\n' '|')
            echo "::notice::$p => $r hilal=$n $x :: $t"
          done
          curl -sSI -m 20 $B/ | grep -i 'x-robots\|server\|date' | tr '\n' ' ' | sed 's/^/::notice::HDR /'
