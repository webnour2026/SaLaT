name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          e=$(curl -sS -m 25 -o /dev/null "https://www.habous.gov.ma/" 2>&1 | tr -d '\n' | cut -c1-200); echo "::notice::ERR $e"
          echo | openssl s_client -connect www.habous.gov.ma:443 -servername www.habous.gov.ma -showcerts 2>/dev/null | grep -E "s:|i:|Verify return" | tr '\n' ' ' | cut -c1-700 | sed 's/^/::notice::CHAIN /'
          for u in "https://www.habous.gov.ma/robots.txt" "https://www.habous.gov.ma/" "https://www.habous.gov.ma/ar" "https://www.habous.gov.ma/fr" "https://www.habous.gov.ma/index.php?format=feed&type=rss" "https://www.habous.gov.ma/ar/index.php?format=feed&type=rss"; do
            r=$(curl -sSLk -m 25 -A "Mozilla/5.0 SaLaTi" -o /tmp/p -w "%{http_code} %{url_effective} %{size_download}" "$u" 2>/dev/null)
            t=$(grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c1-80); h=$(grep -o 'هلال' /tmp/p | wc -l); l=$(grep -io 'lang="[a-z-]*"' /tmp/p | head -1)
            echo "::notice::K $u => $r | $t | $l | hilal=$h"
            case "$u" in *robots*) echo "::notice::ROBOTS $(tr '\n' ' ' < /tmp/p | cut -c1-500)";; esac
          done
