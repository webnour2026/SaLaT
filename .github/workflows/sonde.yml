name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for q in "site:medias24.com" "medias24 Habous" "Médias24 croissant" "site:medias24.com croissant"; do
            e=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
            curl -sS -m 20 "https://news.google.com/rss/search?q=$e&hl=fr&gl=MA&ceid=MA:fr" -o g
            echo "::notice::[$q] items=$(grep -c '<item' g) src=$(grep -o '<source url="[^"]*' g | sort | uniq -c | sort -rn | head -3 | tr -s ' ' | tr '\n' ' ')"
          done
