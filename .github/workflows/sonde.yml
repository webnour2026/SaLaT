name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='SaLaTi-verification/1.0 (appli de prière ; github.com/webnour2026/SaLaT)'
          curl -sL -A "$UA" https://priere.ma/robots.txt | tr '\n' '|' | head -c 1500 > r.txt; echo "::notice title=robots::$(cat r.txt)"
          curl -sL -A "$UA" https://priere.ma/ -o h.html
          n=$(grep -oE 'href="[^"]*horaire-priere-[a-z0-9-]+"' h.html | sort -u | wc -l); echo "::notice title=villes accueil::$n $(grep -oE 'horaire-priere-[a-z0-9-]+' h.html | sort -u | head -40 | tr '\n' ' ')"
          curl -sL -A "$UA" https://priere.ma/sitemap.xml -o s.xml -w "%{http_code}" > c.txt; echo "::notice title=sitemap $(cat c.txt)::$(grep -oE 'horaire-priere-[a-z0-9-]+' s.xml | sort -u | wc -l) villes"
          curl -sL -A "$UA" "https://priere.ma/horaire-priere-imintanoute" -o p.html -w "%{http_code}" > c.txt; echo "::notice title=imintanoute $(cat c.txt)::$(tr '\n' ' ' < p.html | grep -oE 'Alfajr.{0,200}' | head -c 300)"
          curl -sL -A "$UA" "https://priere.ma/mentions-legales" -o m.html -w "%{http_code}" > c.txt; echo "::notice title=mentions $(cat c.txt)::$(sed 's/<[^>]*>/ /g' m.html | tr -s ' \n' ' ' | grep -oiE '.{0,200}(source|habous|reprodu|copie).{0,200}' | head -c 900)"
