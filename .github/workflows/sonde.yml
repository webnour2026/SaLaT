name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://habous.synerticlab.com
          curl -sS -m 25 $B/mawaqit-shahria -o p.html
          s=$(grep -o '<script[^>]*src="[^"]*habous_theme[^"]*"' p.html | grep -o 'src="[^"]*' | cut -c6- | sed 's/&amp;/\&/g' | head -1)
          curl -sS -m 20 "$B$s" -o j.js
          grep -o '.\{0,160\}fetch(.\{0,200\}' j.js | head -8 | while read -r l; do echo "::notice::F $l" | cut -c1-420; done
          grep -oE '"(/|https)[^"]{3,120}"' j.js | sort -u | head -30 | tr '\n' ' ' | sed 's/^/::notice::STR /'; echo
          grep -oE "'(/|https)[^']{3,120}'" j.js | sort -u | head -30 | tr '\n' ' ' | sed 's/^/::notice::STR2 /'; echo
