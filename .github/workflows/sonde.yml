name: sonde
on: workflow_dispatch
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          mkdir out && cd out
          UA='SaLaTi-verification/1.0 (appli de priere ; github.com/webnour2026/SaLaT)'
          curl -s --max-time 30 http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt -o i.crt
          (openssl x509 -inform DER -in i.crt -out sectigo-dv-r36.pem || cp i.crt sectigo-dv-r36.pem); rm -f i.crt
          openssl x509 -in sectigo-dv-r36.pem -noout -subject -issuer -enddate | tr '\n' ' ' | tr -d ',:' | sed 's/^/::notice title=PEM::/'; echo
          r=$(curl -s --cacert <(cat /etc/ssl/certs/ca-certificates.crt sectigo-dv-r36.pem) --max-time 30 -A "$UA" https://www.habous.gov.ma/prieres/index.php?ville=69 -o v69.html -w '%{http_code}'); echo "::notice title=TLSFIX::$r"
          sleep 3; curl -s --cacert <(cat /etc/ssl/certs/ca-certificates.crt sectigo-dv-r36.pem) --max-time 30 -A "$UA" https://www.habous.gov.ma/prieres/index.php?ville=1 -o v1.html
          git init -q && git checkout -q -b sonde-habous && git add . && git -c user.name=bot -c user.email=bot@x commit -qm sonde
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonde-habous
