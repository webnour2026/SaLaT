name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="SaLaTi-verification/1.0 (appli de prière ; github.com/webnour2026/SaLaT)"
          for u in "https://www.mapexpress.ma/ar/feed/" "https://www.mapexpress.ma/wp-json/wp/v2/posts?search=Habous&per_page=2" "https://www.hespress.com/feed" "https://fr.hespress.com/feed" "https://www.medi1news.com/ar/categorie/news" "https://www.medi1news.com/fr/categorie/news" "https://news.google.com/rss/search?q=site:snrtnews.com+when:3d&hl=fr&gl=MA&ceid=MA:fr" "https://www.bing.com/news/search?q=Habous&format=rss"; do
            r=$(curl -sSL -m 20 -A "$UA" -o p -w "%{http_code} %{size_download}" "$u" 2>&1 | cut -c1-80)
            echo "::notice::$r items=$(grep -c '<item' p) src=$(grep -o '<source url="[^"]*' p | sort | uniq -c | sort -rn | head -2 | tr -s ' ' | tr '\n' ' ') :: $u"
          done
          grep -o 'href="[^"]*hespress[^"]*\(feed\|rss\)[^"]*"' p | head -2
