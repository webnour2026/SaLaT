name: Sonde (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p scripts/fixtures
          curl -sS -m 30 "https://habous.synerticlab.com/mawaqit-shahria?ville=305" -o scripts/fixtures/habous-mensuel-305.html
          curl -sS -m 30 "https://habous.synerticlab.com/robots.txt" -o scripts/fixtures/habous-robots.txt
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fixtures && git commit -m "Sonde : page mensuelle des Habous (Imintanoute) pour les tests" && git push
