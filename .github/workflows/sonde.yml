name: sonde
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          for v in 1 40; do
            for u in "index-fr.php?ville=$v" "index.php?ville=$v" "index-fr.php?ville=$v&t=$(date +%s)"; do
              curl -sL -A 'SaLaTi-verification/1.0 (appli de prière ; github.com/webnour2026/SaLaT)' "https://fm6oa.org/prieres/code/$u" -o p.html -w "%{http_code} %{size_download}\n" > s.txt
              node --input-type=module -e "import fs from 'fs';import {parsePage} from './scripts/officiel-lib.mjs';const h=fs.readFileSync('p.html','utf8');const r=parsePage(h);const mo=[...new Set((h.match(/(Rabi[ea][^<]{0,25}|Jouma[^<]{0,25}|Joumada[^<]{0,25}|جمادى[^<]{0,15}|ربيع[^<]{0,15})/gi)||[]))].slice(0,4).join(' | ');console.log('::notice title=v$v $u::'+fs.readFileSync('s.txt','utf8').trim()+' rows='+r.length+' '+(r[0]?.date||'')+'→'+(r.at(-1)?.date||'')+' :: '+mo)"
            done
          done
