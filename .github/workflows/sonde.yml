name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo | openssl s_client -connect www.habous.gov.ma:443 -servername www.habous.gov.ma 2>/dev/null | openssl x509 > leaf.pem
          aia=$(openssl x509 -in leaf.pem -noout -text | grep -o 'CA Issuers - URI:[^ ]*' | cut -d: -f2-); echo "::notice::AIA $aia"
          curl -sS -m 20 "${aia#URI:}" -o inter.der && openssl x509 -inform DER -in inter.der -out inter.pem && openssl x509 -in inter.pem -noout -subject -issuer | tr '\n' ' ' | sed 's/^/::notice::INTER /'; echo
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          r=$(curl -sS --cacert bundle.pem -m 25 -o /tmp/p -w "%{http_code} %{size_download}" https://www.habous.gov.ma/ 2>&1 | cut -c1-150); echo "::notice::VERIFIED $r"
          cat > t.mjs <<'JS'
          const r = await fetch('https://www.habous.gov.ma/'); const s = await r.text();
          console.log('::notice::NODE', r.status, s.length);
          const txt = s.replace(/<script[\s\S]*?<\/script>/g,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
          let i = -1, n = 0; while ((i = txt.indexOf('هلال', i + 1)) >= 0 && n++ < 6) console.log('::notice::CTX', txt.slice(Math.max(0, i - 90), i + 90));
          JS
          NODE_EXTRA_CA_CERTS=inter.pem node t.mjs || echo "::notice::NODE FAIL"
          grep -A3 -i "user-agent: \*" <(curl -sSk https://www.habous.gov.ma/robots.txt) | tr '\n' ' ' | sed 's/^/::notice::ROBOTS* /'
