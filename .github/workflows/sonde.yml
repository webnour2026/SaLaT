name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          out=""
          for c in UClozwh5URilIQpDFeXch8qw UCvtQeUIfmelyvCDMbEPw9vw UCvyivffb2WwNKonKiLwVAEQ UCfXlL8avQjg74WbRyksr9bQ; do
            curl -sS -m 20 "https://www.youtube.com/feeds/videos.xml?channel_id=$c" > f.xml
            m=$(python3 - <<'PY'
          import re
          s=open('f.xml').read()
          for e in re.findall(r'<entry>(.*?)</entry>',s,re.S):
              t=re.search(r'<title>(.*?)</title>',e).group(1); p=re.search(r'<published>(.*?)</published>',e).group(1)
              if re.search('هلال|جمادى|فاتح|الأوقاف|croissant|Joumada',t): print(p[5:16],t[:70])
          PY
          )
            echo "::notice::$c :: $(echo "$m" | tr '\n' '|' | cut -c1-600)"
          done
