name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="SaLaTi-verification/1.0 (appli de prière ; github.com/webnour2026/SaLaT)"
          curl -sS -m 30 -A "$UA" "https://fm6oa.org/prieres/code/index-fr.php?ville=1" -o f.html; echo "::notice::FM6OA $(grep -o '<h[1-4][^>]*>[^<]*' f.html | head -2 | tr '\n' ' ') | $(sed 's/<[^>]*>/ /g' f.html | grep -oE '[0-9]{1,2} [A-Za-zéû.]+ +[0-9]{2}:[0-9]{2}' | head -2 | tr '\n' ' ')"
          curl -sS -m 30 -A "$UA" "https://habous.synerticlab.com/mawaqit-shahria?ville=31" -o h.html; echo "::notice::TEST $(grep -o 'habous-monthly-title[^>]*>[^<]*' h.html | head -1) | $(sed 's/<[^>]*>/ /g' h.html | tr -s ' \n' ' ' | grep -oE '[0-9]{2}:[0-9]{2} [0-9]{2}:[0-9]{2} [0-9]{2}:[0-9]{2}' | head -1)"
