name: Sonde (temporaire)
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - shell: bash {0}
        run: |
          cat > t.mjs <<'JS'
          import { sources, parseRss, extractAny, decide } from './scripts/update-habous.mjs';
          const DAY = 864e5, last = Date.UTC(2026, 8, 13) / DAY;   // 1er Rabia II 1448 → on cherche Joumada I (annoncé le 11 oct.)
          const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, '').split('.').slice(-2).join('.'); } catch { return ''; } };
          const cands = [];
          for (const src of sources(5, 1448).filter(s => s.onlyHost)) {
            try {
              const xml = await (await fetch(src.url)).text();
              const items = parseRss(xml).filter(i => i.host === src.onlyHost && (!i.pub || i.pub >= (last + 27) * DAY));
              const hits = items.map(i => ({ d: extractAny(i.text, last, 5), pub: i.pub })).filter(x => x.d);
              hits.forEach(h => cands.push({ day: h.d, trust: src.trust, host: src.onlyHost }));
              console.log(`::notice::${src.name}: ${items.length} articles, ${hits.length} annonces ${hits.slice(0, 2).map(h => new Date(h.d * DAY).toISOString().slice(0, 10) + ' publié ' + new Date(h.pub).toISOString().slice(5, 16)).join(', ')}`);
            } catch (e) { console.log(`::notice::${src.name}: erreur ${e.message}`); }
          }
          const v = decide(cands); console.log(`::notice::DÉCISION ${v.day ? new Date(v.day * DAY).toISOString().slice(0, 10) : '-'} (${v.why})`);
          JS
          node t.mjs
