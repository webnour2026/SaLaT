# Horaires officiels du ministère dans data/officiel/<numéro>.json (année glissante). L'appli les préfère au calcul.
#   · source principale : tableau mensuel du site du ministère (www.habous.gov.ma/prieres/, horaires mis à disposition
#     des sites web par le ministère), 191 localités ; une page de contrôle par passage, les 191 quand un tableau paraît ;
#   · complément : widget de la Fondation Mohammed VI des Ouléma Africains (fm6oa.org), jours encore absents seulement ;
#   · garde-fous : lignes écartées si elles diffèrent de plus de 2 min du calcul ; rien n'est écrit si plus de 15 % des
#     localités échouent ;
#   · bilan : data/conformite.json compare le calcul à tous les jours officiels conservés ; data/calibration.json propose
#     les réglages du calcul qui colleraient le mieux (appliqués à la main après vérification).
# Premier essai : Actions → « Officiel » → Run workflow → essai coché, « only » = 1 31 100 → lire le résumé du travail.
name: Officiel
on:
  schedule:
    - cron: '20 5 * * *'      # 05:20, 12:20 et 18:20 UTC : un nouveau tableau publié dans la journée est repris le jour même
    - cron: '20 12 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : lire et contrôler sans rien écrire"
        type: boolean
        default: true
      force:
        description: "Tout relire même s'il n'y a rien de nouveau"
        type: boolean
        default: false
      only:
        description: "Seulement ces numéros de localités de l'appli (ex. 1 31 100), vide = toutes"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: officiel
  cancel-in-progress: false
jobs:
  officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: node scripts/test-officiel.mjs
      - name: Site du ministère des Habous (source principale, 191 localités)
        run: node scripts/update-officiel-habous.mjs
        env:
          NODE_EXTRA_CA_CERTS: certs/sectigo-dv-r36.pem   # le serveur n'envoie pas son certificat intermédiaire
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.essai || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
      - name: Fondation Mohammed VI (fm6oa.org), jours encore absents
        run: node scripts/update-officiel.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.essai || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
      - name: Bilan de conformité du calcul
        run: node scripts/rapport-conformite.mjs && node scripts/calibrer.mjs
      - name: Publier si les horaires ont changé
        run: |
          git add data/officiel data/conformite.json data/calibration.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Horaires officiels : mise à jour"
            git push
          fi
