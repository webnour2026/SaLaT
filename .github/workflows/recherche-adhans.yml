# Branche de travail : extraction de l'Adhan d'Anas Tazi depuis YouTube (accord écrit de l'intéressé), vers recherche/anas-tazi.mp3.
name: Recherche Adhans
on:
  push:
    branches: [recherche-adhans]
    paths: ['.github/workflows/recherche-adhans.yml']
permissions:
  contents: write
jobs:
  yt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q -U yt-dlp
      - name: Extraire le son
        run: |
          mkdir -p recherche
          yt-dlp --no-playlist -x --audio-format mp3 --audio-quality 0 -o 'recherche/anas-tazi.%(ext)s' --write-info-json 'https://www.youtube.com/watch?v=3mCyc5w9yc8' 2>&1 | tail -5 || true
          for c in tv_embedded ios mweb android_vr; do [ -f recherche/anas-tazi.mp3 ] && break; yt-dlp --no-playlist --extractor-args "youtube:player_client=$c" -x --audio-format mp3 --audio-quality 0 -o 'recherche/anas-tazi.%(ext)s' --write-info-json 'https://www.youtube.com/watch?v=3mCyc5w9yc8' 2>&1 | tail -3 || true; done
          ls -la recherche
          if [ -f recherche/anas-tazi.info.json ]; then python3 -c "import json;d=json.load(open('recherche/anas-tazi.info.json'));json.dump({k:d.get(k) for k in ['title','channel','uploader','upload_date','duration','webpage_url','license']},open('recherche/anas-tazi.meta.json','w'),ensure_ascii=False,indent=1)"; rm recherche/anas-tazi.info.json; fi
          [ -f recherche/anas-tazi.mp3 ] || echo "::warning title=YouTube::extraction impossible depuis GitHub"
      - name: Publier
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add recherche && git commit -m "Adhan Anas Tazi : extrait de YouTube" && git push || echo rien
