# Télécharge des Adhans sous licence libre (Wikimedia Commons + Freesound), coupe automatiquement
# ce qui précède la voix (ouverture du micro, clics, bruit) et ce qui la suit, convertit en MP3
# 160 kbit/s et écrit audio/adhan/credits.json (auteur + licence lus sur Commons).
# Retirés : La Mecque (x2) et Mosquée Hassan II (trop de bruit de fond).
# Si un Adhan commence encore trop tôt ou trop tard : dans SOURCES ci-dessous, remplacez None
# par le début voulu en secondes (ex. 4.5), puis relancez.
# Lancer : onglet Actions → « Télécharger les Adhans » → Run workflow.
name: Télécharger les Adhans
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  adhans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Télécharger, découper, convertir
        run: |
          cat > /tmp/adhans.py <<'PY'
          # Télécharge, découpe (début/fin de la voix) et convertit les Adhans libres, puis écrit credits.json.
          import json, os, re, html, subprocess, sys, urllib.parse, urllib.request

          UA = f"PriereApp/1.2 (https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'local')})"
          OUT = 'audio/adhan'
          os.makedirs(OUT, exist_ok=True)

          # id, fichier Commons (ou URL), durée max (s), début forcé en secondes (None = automatique)
          SOURCES = [
              ('madinah',    '33937_ejaz215_call-to-prayer-from-the-prophet-s-mo.ogg',            200, None),
              ('aaqib',      'The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3',               100, None),
              ('adhan1',     'Beautiful_adhan.ogg',                                               160, None),
              ('morocco',    'https://cdn.freesound.org/previews/807/807484_3655844-hq.mp3',      80,  None),
          ]

          def get(url, dest=None):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=120) as r:
                  data = r.read()
              if dest: open(dest, 'wb').write(data)
              return data

          def voice_bounds(src):
              """Début et fin de la VOIX de l'Adhan. On ignore les bruits courts (ouverture du micro, clic,
              larsen) et le bruit de fond continu (foule, rue) : seuil adaptatif entre le niveau du fond et
              celui de la voix, dans la bande de la voix (250–3500 Hz), maintenu au moins 1,5 s."""
              import array, math
              pcm = subprocess.run(['ffmpeg', '-v', 'error', '-i', src, '-vn', '-af', 'highpass=f=250,lowpass=f=3500',
                                    '-ac', '1', '-ar', '8000', '-f', 's16le', '-'], capture_output=True).stdout
              a = array.array('h'); a.frombytes(pcm[: len(pcm) // 2 * 2])
              W = 400                                   # fenêtres de 50 ms
              db = []
              for i in range(0, len(a) - W, W):
                  seg = a[i:i + W]
                  rms = math.sqrt(sum(x * x for x in seg) / W) or 1
                  db.append(20 * math.log10(rms))
              if not db: return 0.0, None
              srt = sorted(db)
              floor, peak = srt[int(len(srt) * 0.15)], srt[int(len(srt) * 0.95)]
              thr = floor + 0.5 * (peak - floor)
              active = [d > thr for d in db]
              # combler les petites respirations (< 0,4 s) à l'intérieur d'une phrase
              gap = 0
              for i, v in enumerate(active):
                  if v:
                      if 0 < gap <= 8:
                          for j in range(i - gap, i): active[j] = True
                      gap = 0
                  else: gap += 1
              runs, i = [], 0
              while i < len(active):
                  if active[i]:
                      j = i
                      while j < len(active) and active[j]: j += 1
                      if (j - i) * 0.05 >= 1.5: runs.append((i * 0.05, j * 0.05))
                      i = j
                  else: i += 1
              total = len(db) * 0.05
              if not runs: return 0.0, total
              return max(0.0, runs[0][0] - 0.25), min(total, runs[-1][1] + 1.0)

          def encode(src, out, maxdur, forced):
              begin, end = voice_bounds(src)
              if forced is not None: begin = forced
              length = min(maxdur, (end - begin) if end else maxdur)
              fade = 2.5
              af = (f'highpass=f=70,afade=t=in:st=0:d=0.4,afade=t=out:st={max(0, length - fade):.2f}:d={fade},'
                    'loudnorm=I=-16:TP=-1.5:LRA=11')
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-ss', f'{begin:.2f}', '-i', src, '-vn',
                              '-t', f'{length:.2f}', '-af', af, '-ac', '2', '-ar', '44100', '-b:a', '160k',
                              f'{OUT}/{out}.mp3'], check=True)
              print(f'  ✓ {out}.mp3 : voix de {begin:.1f}s à {begin + length:.1f}s ({length:.0f}s)')

          credits = []
          for key, name, maxdur, forced in SOURCES:
              print(f'→ {key} : {name}')
              try:
                  if name.startswith('http'):
                      get(name, '/tmp/src')
                  else:
                      q = urllib.parse.quote(name)
                      get(f'https://commons.wikimedia.org/wiki/Special:FilePath/{q}', '/tmp/src')
                  encode('/tmp/src', key, maxdur, forced)
              except Exception as e:
                  print('  ✗', e); continue
              if name.startswith('http'):
                  credits.append({'id': key, 'author': 'Iain McCurdy (Aroumd, Haut Atlas)', 'license': 'CC BY 4.0',
                                  'source': 'Freesound', 'url': 'https://freesound.org/people/iainmccurdy/sounds/807484/'})
                  continue
              em = {}
              try:
                  meta = json.loads(get('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
                                        f'&iiprop=extmetadata&titles=File:{urllib.parse.quote(name)}'))
                  em = next(iter(meta['query']['pages'].values()))['imageinfo'][0]['extmetadata']
              except Exception: pass
              clean = lambda v: html.unescape(re.sub(r'<[^>]+>', '', (em.get(v) or {}).get('value', ''))).strip()
              credits.append({'id': key, 'author': clean('Artist') or clean('Credit') or 'Wikimedia Commons',
                              'license': clean('LicenseShortName'), 'source': 'Wikimedia Commons',
                              'url': 'https://commons.wikimedia.org/wiki/File:' + urllib.parse.quote(name)})


          def write_list(out_dir='audio/adhan'):
              """audio/adhan/list.json : tous les MP3 présents, avec un nom lisible tiré du nom de fichier.
              L'appli l'utilise pour afficher automatiquement chaque Adhan déposé."""
              import glob, json, os, re
              items = []
              for f in sorted(glob.glob(out_dir + '/*.mp3')):
                  key = os.path.splitext(os.path.basename(f))[0]
                  label = re.sub(r'[-_]+', ' ', key).strip()
                  label = label[:1].upper() + label[1:]
                  items.append({'id': key, 'file': f'audio/adhan/{os.path.basename(f)}', 'label': label})
              json.dump(items, open(out_dir + '/list.json', 'w'), ensure_ascii=False, indent=1)
              print('list.json :', [x['id'] for x in items])
          if '--no-credits' not in sys.argv:
              json.dump(credits, open(f'{OUT}/credits.json', 'w'), ensure_ascii=False, indent=1)
          write_list(OUT)
          PY
          # retirés : La Mecque x2 et Hassan II (bruit), adhan2 (trop court), sham (droits pas assez clairs)
          rm -f audio/adhan/adhan2.mp3 audio/adhan/sham.mp3 audio/adhan/makkah.mp3 audio/adhan/makkah2.mp3 audio/adhan/casablanca.mp3
          python3 /tmp/adhans.py
          ls -la audio/adhan
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A audio/adhan
          git commit -m "Adhans libres : début et fin coupés automatiquement" || echo "Rien de nouveau"
          git push
